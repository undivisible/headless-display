name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload (leave empty for CI only)
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release source matches its tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git diff --exit-code "$RELEASE_TAG" HEAD -- src resources/Info.plist
          test "$RELEASE_TAG" = "v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' resources/Info.plist)"
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/cache@v4
        with:
          path: deps
          key: macos-arm64-deps-${{ hashFiles('scripts/fetch-deps.sh', 'resources/release-deps.json') }}
      - run: ./scripts/fetch-deps.sh
      - name: Build and verify signature
        run: ./scripts/build.sh
      - name: Test receiver priority and offline speech
        run: |
          clang++ -fobjc-arc -fblocks -framework Foundation tests/device-types.mm -o build/device-types-test
          build/device-types-test
          'build/Headless Display.app/Contents/MacOS/headless-display' --render 'Display disconnected.' build/speech-test.wav
          test -s build/speech-test.wav
      - name: Package app
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Headless-Display-macos-arm64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Headless-Display-macos-arm64
          path: dist
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" dist/* --clobber
